# =============================================================================
# APARIENCIA Y FONDO
# =============================================================================

# Fuente (Asegúrate de tener una Nerd Font instalada)
font_family      JetBrainsMono Nerd Font
font_size        13.0

# Márgenes internos (Para que el texto no pegue con los bordes, estilo Warp)
window_padding_width 10

# =============================================================================
# TEMA: CYBER WAVE (el tema que usabas en Warp)
# =============================================================================

# Fondo degradado vertical #002633 -> #000000 (igual que Warp)
background_image /home/angel/.config/kitty/cyber_wave_bg.png
background_image_layout scaled

# Opacidad: 1.0 = opaco, 0.0 = invisible. Requiere compositor (X11/Wayland).
background_opacity 0.55

# Tinte de la imagen con el color de fondo (0.0 - 1.0).
# IMPORTANTE: con background_image, la transparencia solo se aplica a la
# parte "tintada" de la imagen; sin tint la imagen queda opaca.
background_tint 0.85

# Permite cambiar la opacidad en vivo: Ctrl+Shift+A > M (más opaco)
# y Ctrl+Shift+A > L (menos opaco), o `kitty @ set-background-opacity`
dynamic_background_opacity yes

# Color de fondo de respaldo (si quitas la imagen)
background #001a23
foreground #ffffff

# Cursor (acento teal de Cyber Wave)
cursor            #00bfb3
cursor_text_color #001a23

# Selección
selection_background #007972
selection_foreground #ffffff

# Enlaces
url_color #a5d5fe

# Bordes de paneles
active_border_color   #007972
inactive_border_color #2a3b44

# Barra de pestañas
active_tab_foreground   #ffffff
active_tab_background   #00404f
inactive_tab_foreground #8e8e8e
inactive_tab_background #001a23
tab_bar_background      #000d12

# --- Colores ANSI (terminal_colors de cyber_wave.yaml) ---
# normal
color0  #616161
color1  #ff8272
color2  #b4fa72
color3  #fefdc2
color4  #a5d5fe
color5  #ff8ffd
color6  #d0d1fe
color7  #f1f1f1
# bright
color8  #8e8e8e
color9  #ffc4bd
color10 #d6fcb9
color11 #fefdd5
color12 #c1e3fe
color13 #ffb1fe
color14 #e5e6fe
color15 #feffff

# =============================================================================
# PANELES Y PESTAÑAS (ESTILO WARP)
# =============================================================================

# Habilitar divisiones nativas + stack (necesario para maximizar/minimizar)
enabled_layouts splits,stack

# Limpiar atajos por defecto que puedan chocar
clear_all_shortcuts no

# Nueva pestaña y cerrar pestaña
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

# --- Dividir paneles ---
# Ctrl+Shift+E = división vertical (paneles lado a lado)
map ctrl+shift+e launch --location=vsplit --cwd=current
# Ctrl+Shift+D = división horizontal (paneles arriba/abajo)
map ctrl+shift+d launch --location=hsplit --cwd=current

# --- Cerrar panel seleccionado ---
map ctrl+shift+w close_window

# --- Maximizar / minimizar panel seleccionado (toggle) ---
map ctrl+shift+u toggle_layout stack

# --- Navegar entre paneles con Ctrl+Alt+Flechas ---
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down

# --- Scroll línea por línea en el panel actual ---
map ctrl+shift+up   scroll_line_up
map ctrl+shift+down scroll_line_down

# Paleta de Comandos interactiva
map ctrl+shift+p kitty_shell window

# Recargar configuración sin reiniciar kitty
map ctrl+shift+f5 load_config_file

# =============================================================================
# SELECCIÓN DE TEXTO SOLO CON TECLADO (ESTILO WARP / HINTS)
# =============================================================================

# --- 1. Copiado rápido al portapapeles del sistema (Directo) ---
# Copiar una palabra (Ctrl+Alt+W)
map ctrl+alt+w kitten hints --type word --program @

# Copiar una línea entera (Ctrl+Alt+L)
map ctrl+alt+l kitten hints --type line --program @

# Copiar una ruta de archivo o carpeta (Ctrl+Alt+F)
map ctrl+alt+f kitten hints --type path --program @

# Copiar cualquier texto que parezca un hash/ID (Ctrl+Alt+H)
map ctrl+alt+h kitten hints --type hash --program @


# --- 2. Modo de selección libre con cursor (Paginador) ---
# Usa Neovim para navegar por el historial y seleccionar texto libremente
scrollback_pager nvim +"set clipboard=unnamedplus" +"set nonumber nolist" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
